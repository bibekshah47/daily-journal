{% extends "base.html" %}

{% block title %}Please try again{% endblock %}

{% block content %}
<div class="empty-state">
    <i data-lucide="clock" aria-hidden="true"></i>
    <h1>This page was open too long</h1>
    <p>Go back, reload, and try again.</p>
    {# Write page drafts are saved in this browser, so nothing typed there is lost. #}
    <a href="{{ url_for('entries.home') }}" class="button button-primary" id="go-back">Go back</a>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
    document.getElementById("go-back").addEventListener("click", function (event) {
        if (window.history.length > 1) {
            event.preventDefault();
            window.history.back();
        }
    });
</script>
{% endblock %}
