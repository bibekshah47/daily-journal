
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Daily Journal</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>My Daily Journal</h1>
    <p>A simple place to write my thoughts every day.</p>

    <h2>Today's Journal</h2>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}


    <p>Date: {{ today }}</p>

    <form action="/" method="POST">
        <label for="journal">What's on your mind?</label>
        <br><br>

        <textarea
            id="journal"
            name="journal"
            rows="10"
            cols="50"
            placeholder="Start writing your thoughts here..."></textarea>

        <br><br>

        <button type="submit">Save Entry</button>
    </form>


    <h2>Previous Journal Entries</h2>

    
    {% for entry in entries %}
        <div class="journal-entry">
            <p><strong>Date:</strong> {{ entry[2] }}</p>
            <p>{{ entry[1] }}</p>

            <form
                action="{{ url_for('delete_entry', entry_id=entry[0]) }}"
                method="POST"
                onsubmit="return confirm('Are you sure you want to delete this entry?');"
            >
                <button type="submit" class="delete-button">
                    Delete
                </button>
            </form>
        </div>
    {% endfor %}



</body>
</html>
