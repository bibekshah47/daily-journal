
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Journal | My Journal</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/quill/quill.snow.css') }}">
    <script defer src="{{ url_for('static', filename='vendor/quill/quill.js') }}"></script>
    <script defer src="{{ url_for('static', filename='journal-editor.js') }}"></script>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="sidebar-header">
            <i data-lucide="book-open"></i>
            <span>My Journal</span>
        </div>

        <nav class="sidebar-nav">

            <a href="/#home" class="sidebar-link">
                <i data-lucide="house"></i>
                <span>Home</span>
            </a>

            <a href="{{ url_for('write_journal') }}" class="sidebar-link">
                <i data-lucide="square-pen"></i>
                <span>Write Journal</span>
            </a>

            <a href="{{ url_for('history') }}"
               class="sidebar-link active">
                <i data-lucide="calendar-days"></i>
                <span>Journal History</span>
            </a>

            <a href="/#dashboard-stats" class="sidebar-link">
                <i data-lucide="chart-no-axes-column"></i>
                <span>Insights</span>
            </a>

        </nav>

    </aside>

    <!-- Main Content -->
    <main class="container edit-page">

        <!-- Back Navigation -->
        <a href="{{ url_for('view_entry', entry_id=entry["id"]) }}"
           class="edit-back-link">
            <i data-lucide="arrow-left"></i>
            Back to Journal Entry
        </a>

        <!-- Heading -->
        <div class="edit-page-header">
            <h1>Edit Journal Entry</h1>
            <p>Make changes to your thoughts and memories.</p>
        </div>

        {% if error %}<div class="write-error" role="alert">{{ error }}</div>{% endif %}

        <!-- Edit Form -->
        <form
            method="POST"
            action="{{ url_for('edit_entry', entry_id=entry["id"]) }}"
            class="edit-journal-form"
        >

            <!-- Journal Title -->
            <div class="edit-form-group">

                <label for="title">
                    Journal Title
                    <span class="edit-optional">(Optional)</span>
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Give your journal a title..."
                    value="{{ entry["title"] or '' }}"
                >

            </div>

            <!-- Mood -->
            <div class="edit-form-group">

                <label for="mood">
                    How were you feeling?
                </label>

                <select id="mood" name="mood">

                    <option value="">Select a mood</option>

                    <option value="Happy"
                        {% if entry["mood"] == "Happy" %}selected{% endif %}>
                        😊 Happy
                    </option>

                    <option value="Excited"
                        {% if entry["mood"] == "Excited" %}selected{% endif %}>
                        🤩 Excited
                    </option>

                    <option value="Neutral"
                        {% if entry["mood"] == "Neutral" %}selected{% endif %}>
                        😐 Neutral
                    </option>

                    <option value="Sad"
                        {% if entry["mood"] == "Sad" %}selected{% endif %}>
                        😔 Sad
                    </option>

                    <option value="Stressed"
                        {% if entry["mood"] == "Stressed" %}selected{% endif %}>
                        😣 Stressed
                    </option>

                </select>

            </div>

            <!-- Journal Content -->
            <div class="edit-form-group">

                <label for="journal" id="journal-label">
                    Your Journal Entry
                </label>

                <textarea
                    id="journal"
                    name="journal"
                    rows="12"
                    placeholder="Write your thoughts here..."
                    required
                >{{ entry["content"] }}</textarea>

                <div id="journal-editor" class="journal-editor" hidden></div>
                <input type="hidden" name="editor_format" id="editor-format" value="plain">
                <input type="hidden" name="journal_html" id="journal-html" value="">
                <template id="initial-journal-html">{% if entry.get('content_html') %}{{ entry.get('content_html') | journal_html }}{% endif %}</template>

                <div class="edit-word-count">
                    <span id="word-count">0 words</span>
                </div>

            </div>

        <section class="daily-reflection" id="daily-reflection" aria-labelledby="daily-reflection-heading">
            <header class="reflection-header">
                <h2 id="daily-reflection-heading"><i data-lucide="brain" aria-hidden="true"></i> Daily Reflection</h2>
                <p>Take a moment to reflect on your day · Optional.</p>
            </header>
            <div class="reflection-fields">
                <div class="edit-form-group">
                    <label for="went_well">What went well today?</label>
                    <textarea id="went_well" name="went_well" rows="3" placeholder="Celebrate a small win, a meaningful moment, or something you enjoyed.">{{ entry["went_well"] or '' }}</textarea>
                </div>
                <div class="edit-form-group">
                    <label for="went_wrong">What didn't go well today?</label>
                    <textarea id="went_wrong" name="went_wrong" rows="3" placeholder="Reflect on a challenge, a setback, or something that felt difficult.">{{ entry["went_wrong"] or '' }}</textarea>
                </div>
                <div class="edit-form-group">
                    <label for="improve_tomorrow">What can I improve tomorrow?</label>
                    <textarea id="improve_tomorrow" name="improve_tomorrow" rows="3" placeholder="Think of one small step you can take to make tomorrow better.">{{ entry["improve_tomorrow"] or '' }}</textarea>
                </div>
            </div>
        </section>

            <!-- Buttons -->
            <div class="edit-form-actions">

                <button type="submit"
                        class="edit-save-button">
                    <i data-lucide="check"></i>
                    Save Changes
                </button>

                <a
                    href="{{ url_for('view_entry', entry_id=entry["id"]) }}"
                    class="edit-cancel-button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </main>

    <!-- JavaScript -->
    <script>
        lucide.createIcons();

        const journalTextarea = document.getElementById("journal");
        const wordCount = document.getElementById("word-count");

        function updateWordCount() {
            const text = journalTextarea.value.trim();

            const count = text
                ? text.split(/\s+/).length
                : 0;

            wordCount.textContent = count + " words";
        }

        journalTextarea.addEventListener(
            "input",
            updateWordCount
        );

        updateWordCount();
    </script>

</body>
</html>
